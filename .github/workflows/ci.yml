name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: contentops-agent

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install development dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Parse YAML and check required resources
        run: |
          pip install PyYAML==6.0.3
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          required = {"Namespace", "ConfigMap", "PersistentVolumeClaim", "Deployment", "Service"}
          found = set()
          for path in sorted(pathlib.Path("k8s").glob("*.yaml")):
              documents = list(yaml.safe_load_all(path.read_text()))
              for document in documents:
                  if document is None:
                      continue
                  if not isinstance(document, dict) or "kind" not in document:
                      sys.exit(f"{path}: document without a kind")
                  found.add(document["kind"])
                  print(f"{path}: {document['kind']}/{document['metadata']['name']}")
          missing = required - found
          if missing:
              sys.exit(f"missing required kinds: {sorted(missing)}")
          PY
      - name: Validate against Kubernetes schemas
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name contentops-ci -p 8080:8000 \
            -e DATABASE_PATH=/tmp/contentops.db \
            -e LOG_LEVEL=INFO \
            "${{ env.IMAGE_NAME }}:ci"
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo
              curl -fsS http://localhost:8080/ready
              echo
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy; logs below" >&2
          docker logs contentops-ci >&2
          exit 1
      - name: Container logs
        if: always()
        run: docker logs contentops-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f contentops-ci || true

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [lint, test, manifests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
